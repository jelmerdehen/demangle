name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (race)
        run: go test -race -count=1 ./...

      - name: core coverage gate (>= 80%)
        run: |
          go test -coverprofile=/tmp/cov.out github.com/jelmerdehen/demangle
          pct=$(go tool cover -func=/tmp/cov.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "core coverage = ${pct}%"
          awk -v p="$pct" 'BEGIN{ if (p+0 < 80.0) exit 1 }'

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  fuzz-short:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: fuzz 30s per package
        run: |
          for pkg in $(go list ./... | grep -v /cmd/); do
            go test -run='^$' -fuzz=. -fuzztime=30s "$pkg" || true
          done

  binary-size:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: build + size gate
        run: |
          mkdir -p /tmp/sizes
          go build -ldflags="-s -w" -o /tmp/sizes/full ./cmd/demangle
          full=$(stat -c%s /tmp/sizes/full)
          echo "full build=$full bytes"
          if [ "$full" -gt $((14*1024*1024)) ]; then
            echo "full build exceeded 14 MB headroom"; exit 1
          fi

  bench-regression:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: run bench
        run: |
          mkdir -p build
          go test -run='^$' -bench=. -benchtime=500ms -count=1 \
            ./internal/bench/... > build/bench.new 2>&1

      - name: compare vs baseline
        run: |
          go run ./internal/bench/cmd/bench-compare \
            -old internal/bench/testdata/baselines.bench \
            -new build/bench.new \
            -threshold 25

  deps-audit:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: go mod tidy (no diff)
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod/go.sum not tidy:"
            git diff go.mod go.sum
            exit 1
          fi
