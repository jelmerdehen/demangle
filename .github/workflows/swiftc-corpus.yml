# SPDX-License-Identifier: Apache-2.0
# X1: swiftc corpus parity workflow — compile/parity/drift-check
name: swiftc-corpus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'  # nightly

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: compile Swift sources
        working-directory: scheme/swift/stable/testdata/swiftc
        run: make compile

      - uses: actions/upload-artifact@v4
        with:
          name: swiftc-so
          path: scheme/swift/stable/testdata/swiftc/out/*.so
          retention-days: 7

  parity:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - uses: actions/download-artifact@v4
        with:
          name: swiftc-so
          path: scheme/swift/stable/testdata/swiftc/out

      - name: extract and oracle (regen corpus into /tmp)
        working-directory: scheme/swift/stable/testdata/swiftc
        run: |
          make extract
          make oracle CORPUS=/tmp/corpus-regen.txt

      - name: corpus drift check
        working-directory: scheme/swift/stable/testdata/swiftc
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Compare data lines only (strip volatile comment header lines).
          # Sort both so ordering differences don't cause false positives.
          grep -v '^#' corpus.txt | sort > /tmp/corpus-data.txt
          grep -v '^#' /tmp/corpus-regen.txt | sort > /tmp/regen-data.txt
          # Drift = symbols in fresh that are NOT in committed (new .swift code
          # added without regenerating). Symbols in committed but absent from
          # fresh are tolerated (Swift version may not emit all symbols).
          extra=$(comm -23 /tmp/regen-data.txt /tmp/corpus-data.txt)
          if [[ -n "$extra" ]]; then
            echo "CORPUS_DRIFT=1" >> "$GITHUB_ENV"
            echo "Corpus drift detected: fresh regeneration has symbols not in committed corpus"
            if [[ "$PR_TITLE" != *"[corpus-bump]"* ]]; then
              echo "$extra" | head -40
              exit 1
            fi
          else
            echo "CORPUS_DRIFT=0" >> "$GITHUB_ENV"
          fi

      - name: corpus summary
        working-directory: scheme/swift/stable/testdata/swiftc
        run: |
          SYMBOL_COUNT=$(grep -c '^\$s' corpus.txt 2>/dev/null || echo 0)
          echo "SYMBOL_COUNT=$SYMBOL_COUNT" >> "$GITHUB_ENV"
          if [[ "${CORPUS_DRIFT:-0}" == "1" ]]; then
            echo "::error::corpus drift detected ($SYMBOL_COUNT symbols)"
            DRIFT_STATUS="⚠️ drift detected"
          else
            echo "::notice::corpus ✅ $SYMBOL_COUNT symbols, no drift"
            DRIFT_STATUS="✅ none"
          fi
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Corpus Status
          | Field | Value |
          |-------|-------|
          | Symbols | $SYMBOL_COUNT |
          | Drift | $DRIFT_STATUS |
          | Three-way parity | run parity job to see results |
          EOF

      - name: Three-way parity
        run: |
          go test ./scheme/swift/stable/ -run TestThreeWayParity -v -timeout 120s 2>&1 | tee /tmp/parity-out.txt
          TEST_RESULT=$(tail -1 /tmp/parity-out.txt)
          # Parse summary lines emitted by fmt.Printf in the test
          PARITY_LINE=$(grep '^\s*parity:' /tmp/parity-out.txt | tail -1 || echo '')
          RT_LINE=$(grep '^\s*roundtrip:' /tmp/parity-out.txt | tail -1 || echo '')
          PARITY_PASS=$(echo "$PARITY_LINE" | grep -oP '\d+(?=/)' | head -1 || echo 0)
          PARITY_TOTAL=$(echo "$PARITY_LINE" | grep -oP '(?<=/)\d+' | head -1 || echo 0)
          RT_PASS=$(echo "$RT_LINE" | grep -oP '\d+(?=/)' | head -1 || echo 0)
          RT_TOTAL=$(echo "$RT_LINE" | grep -oP '(?<=/)\d+' | head -1 || echo 0)
          RT_UNSUPPORTED=$(echo "$RT_LINE" | grep -oP '\d+(?= unsupported)' | head -1 || echo 0)
          {
            echo "PARITY_PASS=${PARITY_PASS}"
            echo "PARITY_TOTAL=${PARITY_TOTAL}"
            echo "RT_PASS=${RT_PASS}"
            echo "RT_TOTAL=${RT_TOTAL}"
            echo "RT_UNSUPPORTED=${RT_UNSUPPORTED}"
            echo "PARITY_RESULT=${TEST_RESULT}"
          } >> "$GITHUB_ENV"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF

          ## Three-way Parity
          | Field | Value |
          |-------|-------|
          | Result | $TEST_RESULT |
          | Parity | $PARITY_PASS/$PARITY_TOTAL pass |
          | Round-trip | $RT_PASS/$RT_TOTAL pass ($RT_UNSUPPORTED unsupported) |
          EOF

      - name: Post PR corpus summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          CORPUS_DRIFT: ${{ env.CORPUS_DRIFT }}
          SYMBOL_COUNT: ${{ env.SYMBOL_COUNT }}
          PARITY_PASS: ${{ env.PARITY_PASS }}
          PARITY_TOTAL: ${{ env.PARITY_TOTAL }}
          RT_PASS: ${{ env.RT_PASS }}
          RT_TOTAL: ${{ env.RT_TOTAL }}
          RT_UNSUPPORTED: ${{ env.RT_UNSUPPORTED }}
          PARITY_RESULT: ${{ env.PARITY_RESULT }}
        with:
          script: |
            const marker = '<!-- swiftc-corpus-bot -->';
            const drift = process.env.CORPUS_DRIFT === '1' ? ':warning: DRIFT' : ':white_check_mark: CLEAN';
            const parityPass = process.env.PARITY_PASS || '?';
            const parityTotal = process.env.PARITY_TOTAL || '?';
            const rtPass = process.env.RT_PASS || '?';
            const rtTotal = process.env.RT_TOTAL || '?';
            const rtUnsupported = process.env.RT_UNSUPPORTED || '0';
            const symbolCount = process.env.SYMBOL_COUNT || '?';
            const parityResult = process.env.PARITY_RESULT || '';
            const parityIcon = parityPass === parityTotal && parityTotal !== '?' ? ':white_check_mark:' : ':x:';
            const rtIcon = rtPass === rtTotal && rtTotal !== '?' ? ':white_check_mark:' : ':x:';
            const body = [
              marker,
              '## Swift Corpus Summary',
              '',
              '| Field | Value |',
              '|-------|-------|',
              `| Corpus size | ${symbolCount} symbols |`,
              `| Corpus drift | ${drift} |`,
              `| Parity | ${parityIcon} ${parityPass}/${parityTotal} pass |`,
              `| Round-trip | ${rtIcon} ${rtPass}/${rtTotal} pass (${rtUnsupported} unsupported) |`,
              `| Test result | \`${parityResult}\` |`,
            ].join('\n');

            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  bench:
    runs-on: ubuntu-latest
    needs: parity
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: bench remangle (if available)
        run: |
          if go test ./scheme/swift/stable/ -run '^$' -bench=BenchmarkRemangle -benchtime=1x -count=1 2>&1 \
              | grep -q 'no tests to run\|testing: warning: no tests to run'; then
            echo "BenchmarkRemangle not yet implemented — skipping"
          else
            go test ./scheme/swift/stable/ -run '^$' -bench=BenchmarkRemangle -benchtime=5s -count=1
          fi
